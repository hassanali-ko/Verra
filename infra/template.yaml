AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Scheduled Verra research dispatch. The AgentCore runtime is deployed separately.
Parameters:
  ProductDatabaseUrl:
    Type: String
    AllowedPattern: 'https://[a-zA-Z0-9.-]+'
  WorkerSecretArn:
    Type: String
  AgentRuntimeArn:
    Type: String
Resources:
  Dispatcher:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dispatcher.lambda_handler
      Runtime: python3.12
      Timeout: 240
      MemorySize: 256
      # Reserving concurrency needs an account whose total limit is above 10.
      # A new account starts at 10, and reserving any of it is rejected. The
      # once-a-minute schedule and one-job-per-invocation handler already bound
      # throughput; restore this on an account with a raised limit.
      # ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          SUPABASE_PRODUCT_URL: !Ref ProductDatabaseUrl
          WORKER_SECRET_ARN: !Ref WorkerSecretArn
          AGENT_RUNTIME_ARN: !Ref AgentRuntimeArn
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref WorkerSecretArn
            - Effect: Allow
              Action: bedrock-agentcore:InvokeAgentRuntime
              Resource:
                - !Ref AgentRuntimeArn
                - !Sub '${AgentRuntimeArn}/runtime-endpoint/*'
      Events:
        DueWork:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Enabled: true
      EventInvokeConfig:
        MaximumRetryAttempts: 0
  DispatcherLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Dispatcher}'
      RetentionInDays: 14
Outputs:
  DispatcherArn:
    Value: !GetAtt Dispatcher.Arn
