<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 1800 1300" role="img" aria-labelledby="title desc">
<title id="title">Verra personal research architecture</title><desc id="desc">A person uses Next.js on Vercel. Supabase holds account-scoped visits and jobs. EventBridge triggers Lambda to claim work and invoke Python Strands on AgentCore. Strands uses direct OpenAI Luna, public-page retrieval and permission-aware drafting. Validated reports return to Postgres. The example demo stays in the browser.</desc>
