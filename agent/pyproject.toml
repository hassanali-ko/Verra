[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "verra-agent"
version = "0.1.0"
description = "Permission-aware venue research for Verra arrangements"
requires-python = ">=3.12"
dependencies = [
 "strands-agents[openai]==1.55.1", "openai==2.54.0", "pydantic==2.13.5",
 "bedrock-agentcore==1.23.0", "boto3==1.43.93", "beautifulsoup4==4.15.0",
 "urllib3==2.7.0", "httpx==0.28.1", "python-dotenv==1.2.3"
]

[project.scripts]
verra-agent = "verra_agent.cli:main"

[tool.setuptools.package-data]
verra_agent = ["instructions.txt"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

